name: Daily weather image

on:
  schedule:
    # 03:17 UTC = 04:17 in winter / 05:17 in summer, Leipzig time
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write # only for the keep-alive step

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Screen size of the Kindle in pixels (portrait).
  KINDLE_WIDTH: "600"
  KINDLE_HEIGHT: "800"
  # portrait, landscape-left (Kindle turned so its buttons are on the left)
  # or landscape-right (buttons on the right).
  KINDLE_ORIENTATION: "landscape-right"

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y fonts-dejavu-core
      - run: pip install -r requirements.txt
      - run: python generate.py --out site/weather.png
      - run: cp index.html kindle/weather.sh site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
      # GitHub pauses scheduled workflows after 60 days without commits.
      # Re-enabling the workflow resets that timer, so the schedule keeps running.
      - name: Keep the schedule alive
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/weather.yml/enable"
